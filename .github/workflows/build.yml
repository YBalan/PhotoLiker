name: Build and Package PhotoLikerUI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Run it by hand from the Actions tab on any branch (e.g. to get an installer of a feature branch)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore PhotoLikerUI/PhotoLikerUI.csproj

      - name: Build
        run: dotnet build PhotoLikerUI/PhotoLikerUI.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish PhotoLikerUI/PhotoLikerUI.csproj --configuration Release --no-build --output publish/PhotoLikerUI

      - name: Zip artifacts
        shell: pwsh
        run: Compress-Archive -Path publish/PhotoLikerUI/* -DestinationPath PhotoLikerUI.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoLikerUI
          path: PhotoLikerUI.zip

      # The installer: the same script that is run by hand (installer\build-installer.ps1). It publishes the app again
      # (framework-dependent, win-x64) into the same folder, which is why it comes after the zip.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if ((Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or (Test-Path $iscc)) {
            Write-Host 'Inno Setup is already on this runner.'
          } else {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Installing Inno Setup failed with exit code $LASTEXITCODE" }
          }

      - name: Build installer
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PhotoLiker-Setup
          path: publish/installer/PhotoLiker-Setup-*.exe
          if-no-files-found: error
          compression-level: 0 # the installer is compressed already

  # The tests run beside the build, not in front of it: a red test does not take the installer of a feature branch away, but the push (or pull request) shows red. Every suite runs
  # even when an earlier one failed, so that one run says everything that is wrong, not only the first thing (the same suites as the release in release.yml, which stops at the first).
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test the Core library
        run: dotnet test PhotoLiker.Tests/PhotoLiker.Tests.csproj --configuration Release

      - name: Test the video library
        if: ${{ !cancelled() }}
        run: dotnet test PhotoLiker.GenerateVideo.Tests/PhotoLiker.GenerateVideo.Tests.csproj --configuration Release

      - name: Test the library of videos in the archive
        if: ${{ !cancelled() }}
        run: dotnet test PhotoLiker.Video.Tests/PhotoLiker.Video.Tests.csproj --configuration Release

      - name: Test the search library
        if: ${{ !cancelled() }}
        run: dotnet test PhotoLiker.Search.Tests/PhotoLiker.Search.Tests.csproj --configuration Release

      - name: Test the effects library
        if: ${{ !cancelled() }}
        run: dotnet test PhotoLiker.Effects.Tests/PhotoLiker.Effects.Tests.csproj --configuration Release

      # Opens the real windows of the app (a short flash on the runner's desktop)
      - name: Test the windows
        if: ${{ !cancelled() }}
        run: dotnet test PhotoLikerUI.Tests/PhotoLikerUI.Tests.csproj --configuration Release
